name: Deploy project introductions to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'QRise_Ads/**'
      - 'Passdown_Ad/**'
      - '.github/workflows/deploy-landing-page.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: QRise_Ads
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: QRise_Ads/package-lock.json
      - uses: actions/configure-pages@v5
      - run: npm ci
      - run: npm run build
      - name: Assemble both introduction pages
        run: |
          mkdir -p "$RUNNER_TEMP/project-pages/QRise_Ad" "$RUNNER_TEMP/project-pages/Passdown_Ad"
          cp -R dist/. "$RUNNER_TEMP/project-pages/QRise_Ad/"
          cp ../Passdown_Ad/index.html ../Passdown_Ad/styles.css ../Passdown_Ad/script.js ../Passdown_Ad/favicon.svg "$RUNNER_TEMP/project-pages/Passdown_Ad/"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/project-pages
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}Passdown_Ad/
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
